server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Allow large diagram uploads (matches backend MAX_FILE_SIZE_MB=20 + headroom)
    client_max_body_size 30m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    # NOTE: Host header is set to BACKEND_HOST so Azure Container Apps' Envoy
    # ingress can route to the correct internal app.
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              ${BACKEND_HOST};
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Sample diagrams (served by backend)
    location /samples/ {
        proxy_pass         http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host              ${BACKEND_HOST};
    }

    # Basic gzip
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_types         text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
